<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b1e" />
    <meta name="description" content="Spin the globe and explore the world's most iconic places, landmarks and natural wonders." />
    <title>Iconic · the world's landmarks on a globe</title>
    <link rel="canonical" href="https://iconic.place/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iconic" />
    <meta property="og:url" content="https://iconic.place/" />
    <meta property="og:title" content="Iconic · the world's landmarks on a globe" />
    <meta property="og:description" content="Spin the globe and explore the world's most iconic places, landmarks and natural wonders." />
    <meta property="og:image" content="https://iconic.place/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The word Iconic beside an illustrated globe dotted with photos of famous landmarks." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Iconic · the world's landmarks on a globe" />
    <meta name="twitter:description" content="Spin the globe and explore the world's most iconic places, landmarks and natural wonders." />
    <meta name="twitter:image" content="https://iconic.place/og.jpg" />
    <!-- every landmark, asked for before the app's own code has loaded -->
    <link rel="preload" href="/api/landmarks" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map" aria-label="Globe of iconic landmarks"></div>

    <header class="brand">
      <h1>Iconic</h1>
    </header>

    <div id="search" class="search" role="search">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
        <input id="search-input" type="text" inputmode="search" enterkeyhint="search" placeholder="Search places" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-label="Search landmarks" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" />
        <button id="search-clear" type="button" class="search-clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg>
        </button>
      </div>
      <div id="search-panel" class="search-panel" hidden>
        <div id="search-filters" class="search-filters"></div>
        <ul id="search-results" class="search-results" role="listbox" aria-label="Matching places"></ul>
        <p id="search-note" class="search-note" hidden></p>
      </div>
    </div>

    <nav class="actions" aria-label="Explore">
      <button id="random" type="button">Surprise me</button>
    </nav>

    <a class="made-by" href="https://x.com/benjdicken" target="_blank" rel="noopener">Made by Ben</a>

    <p id="notice" class="notice" role="alert" hidden></p>

    <aside id="card" class="card" aria-live="polite" hidden></aside>

    <dialog id="lightbox" class="lightbox" aria-label="Photo">
      <button id="lightbox-close" type="button" class="icon-btn lightbox-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      <button id="lightbox-prev" type="button" class="icon-btn lightbox-step prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15.25 5.5 8.75 12l6.5 6.5"/></svg></button>
      <button id="lightbox-next" type="button" class="icon-btn lightbox-step next" aria-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8.75 5.5 15.25 12l-6.5 6.5"/></svg></button>
      <figure>
        <img id="lightbox-img" alt="" />
        <figcaption>
          <strong id="lightbox-title"></strong>
          <span id="lightbox-count" class="lightbox-count"></span>
          <span id="lightbox-credit"></span>
        </figcaption>
      </figure>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
